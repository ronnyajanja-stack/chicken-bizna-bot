<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Bizna AI Support</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #108548;
            color: #ffffff;
            padding: 16px;
            text-align: center;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.bot {
            align-self: flex-start;
            background: #eef2f5;
            color: #333333;
            border-bottom-left-radius: 2px;
        }

        .message.user {
            align-self: flex-end;
            background: #108548;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            padding: 12px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 24px;
            outline: none;
            font-size: 0.95rem;
        }

        .chat-input-area input:focus {
            border-color: #108548;
        }

        .chat-input-area button {
            background: #108548;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
        }

        .chat-input-area button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Chicken Bizna Virtual Assistant</div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">Hello! Welcome to Chicken Bizna. How can I help you today?</div>
    </div>

    <form class="chat-input-area" id="chatForm">
        <input type="text" id="userInput" placeholder="Ask about chicks, feeds, pricing..." autocomplete="off" required />
        <button type="submit" id="sendBtn">Send</button>
    </form>
</div>

<script>
    const form = document.getElementById('chatForm');
    const input = document.getElementById('userInput');
    const messages = document.getElementById('chatMessages');
    const sendBtn = document.getElementById('sendBtn');

    function appendMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender);
        msgDiv.innerText = text;
        messages.appendChild(msgDiv);
        messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const query = input.value.trim();
        if (!query) return;

        appendMessage(query, 'user');
        input.value = '';
        input.disabled = true;
        sendBtn.disabled = true;

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: query })
            });

            const data = await res.json();
            appendMessage(data.reply || data.error, 'bot');
        } catch (err) {
            appendMessage("Error communicating with server.", 'bot');
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    });
</script>

</body>
</html>
