<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chicken Bizna Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 90vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .chat-header {
      background-color: #128c7e;
      color: #ffffff;
      padding: 16px;
      font-weight: 600;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #efeae2;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user-message {
      align-self: flex-end;
      background-color: #d9fdd3;
      color: #111b21;
      border-top-right-radius: 2px;
    }

    .bot-message {
      align-self: flex-start;
      background-color: #ffffff;
      color: #111b21;
      border-top-left-radius: 2px;
      box-shadow: 0 1px 1px rgba(0,0,0,0.06);
    }

    .loading-bubble {
      color: #667781;
      font-style: italic;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .spinner {
      animation: spin 1.2s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .chat-input-area {
      display: flex;
      padding: 12px;
      background-color: #f0f2f5;
      border-top: 1px solid #e0e0e0;
      gap: 8px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 24px;
      outline: none;
      font-size: 0.95rem;
    }

    .chat-input-area input:focus {
      border-color: #128c7e;
    }

    .chat-input-area button {
      background-color: #128c7e;
      color: #ffffff;
      border: none;
      padding: 0 18px;
      border-radius: 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .chat-input-area button:disabled {
      background-color: #9cb4af;
      cursor: not-allowed;
    }

    .chat-input-area button:hover:not(:disabled) {
      background-color: #075e54;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <span>🐔</span>
      <span>Chicken Bizna Support</span>
    </div>

    <div class="chat-messages" id="chat-messages">
      <div class="message bot-message">
        Hello! Welcome to Chicken Bizna. Feel free to ask about our chicks, feeds, management guides, or prices!
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off" />
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const inputEl = document.getElementById("user-input");
    const chatBox = document.getElementById("chat-messages");
    const sendBtn = document.getElementById("send-btn");

    inputEl.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !sendBtn.disabled) {
        sendMessage();
      }
    });

    async function sendMessage() {
      const userMessage = inputEl.value.trim();
      if (!userMessage) return;

      // Disable inputs while processing
      inputEl.value = "";
      inputEl.disabled = true;
      sendBtn.disabled = true;

      // 1. Render user message
      const userDiv = document.createElement("div");
      userDiv.className = "message user-message";
      userDiv.textContent = userMessage;
      chatBox.appendChild(userDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      // 2. Render loading indicator
      const loadingId = "loader-" + Date.now();
      const botLoadingDiv = document.createElement("div");
      botLoadingDiv.className = "message bot-message";
      botLoadingDiv.id = loadingId;
      botLoadingDiv.innerHTML = `
        <span class="loading-bubble">
          Generating response... <span class="spinner">⏳</span>
        </span>
      `;
      chatBox.appendChild(botLoadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      // 3. Send request to backend
      try {
        const endpoint = window.location.origin + "/api/chat";
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({ message: userMessage })
        });

        const placeholder = document.getElementById(loadingId);

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          const errMsg = errorData.reply || `Server responded with status ${response.status}`;
          if (placeholder) {
            placeholder.textContent = errMsg;
          }
        } else {
          const data = await response.json();
          if (placeholder) {
            placeholder.textContent = data.reply || "No reply content received.";
          }
        }
      } catch (error) {
        console.error("Network or fetch error:", error);
        const placeholder = document.getElementById(loadingId);
        if (placeholder) {
          placeholder.textContent = "Connection failed. Please ensure the server is online and try again.";
        }
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }
  </script>
</body>
</html>
